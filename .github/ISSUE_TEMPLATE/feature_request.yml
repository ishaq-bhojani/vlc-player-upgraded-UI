name: Feature request
description: An idea that would make Vireo better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or the problem, not only the solution. "When I watch a series, I have to find the next episode myself" helps more than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like Vireo to handle it? Sketches and screenshots of other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library (videos, music, folders)
        - Player and controls
        - Settings
        - Keyboard shortcuts
        - Look and themes
        - Installer and updates
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
