name: Bug report
description: Something in Vireo does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Vireo is not made by VideoLAN, so please report Vireo problems here and not to them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Open the Music page
        2. Play an album
        3. The cover is not shown in the player
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vireo version
      description: Shown in Menu › Help › About, for example "Vireo 0.1.0 (build 5)".
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installer or portable?
      options:
        - Installer (.exe)
        - Portable (.zip)
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example "Windows 11 24H2". Press Win+R and run `winver` to see it.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: The file or stream
      description: If it is about one file, its format (for example "MKV, H.265, 4K, with ASS subtitles"). Please do not attach copyrighted files.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or log
      description: |
        Drag screenshots here. For a log: Settings › General › turn on *Log to file*, restart Vireo, reproduce the problem and attach the file (it can contain file names; remove anything private).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
